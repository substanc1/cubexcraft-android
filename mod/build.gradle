// CubeX Mobile's in-game helper (client only, phones only): keeps the frame rate by the render distance. Built on the VPS
// (ModDevGradle, as the other CubeXCraft mods); the jar ships inside the app (app/src/main/assets/mods).
plugins {
    id 'net.neoforged.moddev' version '2.0.78'
}

version = project.mod_version
group = project.mod_group_id
base { archivesName = project.mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = '2024.11.17'
        minecraftVersion = '1.21.1'
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}

repositories { mavenCentral() }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

processResources {
    def props = [
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        minecraft_version: minecraft_version, loader_version_range: loader_version_range,
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
