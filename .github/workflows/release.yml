name: Release APK

# CubeX Mobile 3.0 for phones (arm64-v8a), the release that installs over CubeX Mobile 2.7.x: package site.cubexcraft.mobile,
# signed with the CubeX key from the secrets (the same as the 2.7.x repository):
#   CUBEX_KEYSTORE_B64        base64 of cubex-release.jks
#   CUBEX_KEYSTORE_PASSWORD   its password (store and key, alias "cubexcraft")
# Without them a test APK (site.cubexcraft.mobile.v3dev) is built instead.

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Build number (versionCode = 300000 + build)"
        required: true
        default: "100"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# public repo: the build token only reads; the release key comes from the secrets, which runs from forks never get
permissions:
  contents: read

env:
  # certificate of the published CubeX Mobile (SHA-256); a release signed with another key would not install over it
  CUBEX_CERT_SHA256: 98b07a07f3d533e764e17ca876474554fe385debb9a54add910c97200a9ce813
  NDK_VERSION: "27.3.13750724"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # our licence: not a line of Zalith Launcher (GPL-3.0) in the app — its packages must not appear in our sources
      - name: No Zalith code
        run: |
          if grep -rIlE "com\.movtery|zalithlauncher" app/src core/src; then
            echo "::error::Zalith Launcher code found (see the files above)"; exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: on-failure

      - name: Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - name: Release key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.CUBEX_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CUBEX_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cubex-release.jks"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No release key in the secrets: building a test APK (site.cubexcraft.mobile.v3dev)"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          CUBEX_KEYSTORE: ${{ runner.temp }}/cubex-release.jks
          CUBEX_KEYSTORE_PASSWORD: ${{ secrets.CUBEX_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          variant=${{ steps.key.outputs.variant }}
          ./gradlew ":app:assemble${variant^}" -PcubexBuild=${{ inputs.build }}

      - name: Check the signature
        if: steps.key.outputs.variant == 'release'
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          got=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "certificate: $got"
          [ "$got" = "$CUBEX_CERT_SHA256" ] || { echo "::error::APK is not signed with the CubeX key"; exit 1; }

      - name: Name the APK
        id: apk
        run: |
          variant=${{ steps.key.outputs.variant }}
          src=$(ls app/build/outputs/apk/$variant/*.apk | head -1)
          name="CubeX-android-3.0.0-b${{ inputs.build }}-arm64-$variant.apk"
          mkdir -p out && cp "$src" "out/$name"
          (cd out && sha256sum "$name" | tee "$name.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: out/*
          retention-days: 7

      - name: Upload mapping
        if: steps.key.outputs.variant == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ steps.apk.outputs.name }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
